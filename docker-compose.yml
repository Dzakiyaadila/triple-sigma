x-backend-environment: &backend-environment
  DATABASE_URL: postgresql+psycopg://restockiq:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/restockiq
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}
  RESTOCKIQ_ARTIFACT_DIR: /app/artifacts/restockiq-demand-v1

services:
  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: restockiq
      POSTGRES_USER: restockiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - restockiq_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restockiq -d restockiq"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend-bootstrap:
    image: restockiq-backend:${RESTOCKIQ_IMAGE_TAG:-local}
    build:
      context: ./backend
    environment: *backend-environment
    command: ["python", "-m", "app.db.seed"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    image: restockiq-backend:${RESTOCKIQ_IMAGE_TAG:-local}
    restart: unless-stopped
    environment: *backend-environment
    depends_on:
      backend-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    image: restockiq-frontend:${RESTOCKIQ_IMAGE_TAG:-local}
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v2}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - restockiq_caddy_data:/data
      - restockiq_caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  restockiq_pgdata:
  restockiq_caddy_data:
  restockiq_caddy_config:
